<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baal Studio - Documentación Patrimonial</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Tipografía Montserrat de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- CABECERA CON LOGO PRINCIPAL -->
  <header class="main-header">
    <div class="logo-header">
      <img src="https://hlyzyeatnbulyfiiwvsq.supabase.co/storage/v1/object/public/site/NEWBaal_Logo_White.png" alt="Baal Studio Logo">
    </div>
  </header>

  <!-- SECCIÓN HERO CON FONDO WEBP -->
  <section class="hero-section" style="background-image: url('https://hlyzyeatnbulyfiiwvsq.supabase.co/storage/v1/object/public/site/fondo.webp');">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">DOCUMENTACIÓN PATRIMONIAL</h1>
    </div>
  </section>

  <!-- REJILLA DE PROYECTOS (Cargada mediante Edge Function) -->
  <main class="portfolio-container">
    <div id="projects-grid" class="projects-grid">
      <!-- Las tarjetas de los proyectos se inyectarán aquí automáticamente -->
    </div>
  </main>

  <!-- MARCA DE AGUA / LOGO SECUNDARIO AL 12% -->
  <div class="brand-secondary-container">
    <img src="https://hlyzyeatnbulyfiiwvsq.supabase.co/storage/v1/object/public/site/LNS_LOGO_WHITE.png" alt="Baal Studio Secondary Logo" class="brand-secondary-img">
  </div>

  <!-- PIE DE PÁGINA CON CÓDIGO QR Y LINKTREE -->
  <footer class="main-footer">
    <div class="footer-qr-container">
      <a href="https://linktr.ee/baalstudio" target="_blank" rel="noopener">
        <img src="https://hlyzyeatnbulyfiiwvsq.supabase.co/storage/v1/object/public/site/QRBAAL.png" alt="QR Linktree Baal Studio" class="footer-qr-img">
      </a>
    </div>
  </footer>

  <!-- LÓGICA DE CARGA DIRECTA -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const projectsGrid = document.getElementById("projects-grid");

      try {
        // Llamada a la Edge Function desplegada en Supabase
        const response = await fetch("https://hlyzyeatnbulyfiiwvsq.supabase.co/functions/v1/get-projects");
        const data = await response.json();

        if (!data.projects || data.projects.length === 0) {
          projectsGrid.innerHTML = "<p class='no-projects'>No hay proyectos disponibles en este momento.</p>";
          return;
        }

        projectsGrid.innerHTML = "";

        // Generar la tarjeta de cada proyecto devuelto por la función
        data.projects.forEach((project) => {
          const card = document.createElement("div");
          card.className = "project-card";

          const imageUrl = project.signed_image_url || "https://via.placeholder.com/600x400?text=Sin+Imagen";

          card.innerHTML = `
            <div class="project-thumb-container">
              <img src="${imageUrl}" alt="${project.title}" class="project-thumb" loading="lazy">
            </div>
            <div class="project-info">
              <h3 class="project-title">${project.title}</h3>
              <p class="project-meta">Documentación Patrimonial</p>
            </div>
          `;

          projectsGrid.appendChild(card);
        });

      } catch (error) {
        console.error("Error al obtener proyectos:", error);
        projectsGrid.innerHTML = "<p class='no-projects'>Error al cargar los proyectos.</p>";
      }
    });
  </script>

</body>
</html>
